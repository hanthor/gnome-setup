[package]
name = "gnome-setup"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gettext-sys = { version = "*" }
gvdb-macros = "0.1"
appstream = { package = "libappstream", version = "0.4" }
log = "0.4"
thiserror = "2.0"
zbus = "5.16"
zlink = { version = "0.5", default-features = false, features = ["server", "service", "proxy", "defmt", "smol"] }
quick-xml = { version = "0.40", features = ["serialize"] }
serde = "1.0"
constcat = "0.6"
formatx = "0.3"
glob = "0.3.3"
async-io = "2.6.0"
indexmap = "2.14.0"
qrcode = { version = "0.14", default-features = false }

[dependencies.glib]
version = "*"
features = ["log"]

[dependencies.gtk]
package = "gtk4"
version = "*"
features = ["gnome_48", "blueprint"]

[dependencies.adw]
package = "libadwaita"
version = "0.8"
features = ["v1_5"]

[dependencies.gnome-desktop]
git = "https://gitlab.gnome.org/jsparber/gnome-desktop-rs.git"
branch = "update_everything"
version = "0.5"
