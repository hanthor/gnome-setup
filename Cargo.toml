[package]
name = "gnome-setup"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.82"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gettext-sys = { version = "*" }
gnome-desktop = "0.4.2"
gvdb-macros = "0.1.12"
appstream = { package = "libappstream", version = "0.1.0" }
log = "0.4.21"
thiserror = "1.0.61"
zbus = "4.2.2"
quick-xml = { version = "0.31.0", features = ["serialize"] }
serde = "1.0.203"
constcat = "0.5.0"
udisks2 = { git = "https://github.com/FineFindus/udisks-rs.git" }
glob = "0.3.1"
futures = "0.3.30"

[dependencies.glib]
version = "*"
features = ["log"]

[dependencies.gtk]
package = "gtk4"
version = "*"
features = ["gnome_46", "blueprint"]

[dependencies.adw]
package = "libadwaita"
version = "0.6"
features = ["v1_5"]