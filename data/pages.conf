[modes]
# Things with % are just reusable variables
%initial-setup-start=language;keyboard;prerelease-warning;eula;privacy;network;timezone

# These are the actual modes that setup might run in
initial-setup=%initial-setup-start;user;initial-setup-done
live-initial-setup=%initial-setup-start;try-or-install;installer;disk-passphrase;recovery-key;installer-done
installer=installer-welcome;installer;disk-passphrase;recovery-key;installer-done
existing-user=language;keyboard;privacy;set-password;initial-setup-done

# Pages can have a section if they want some of their own settings
[page:language]
# languages=en_US;it_IT;de_DE;ru_UA

[page:keyboard]
# layouts=us